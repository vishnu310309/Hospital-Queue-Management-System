<!DOCTYPE html>
<html>
<head>
    <title>Manage Doctors</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Manage Doctors</h1>

    <div class="box">

        <h2>Add New Doctor</h2>

        <form action="/add-doctor" method="POST">

            <input type="text"
                   name="doctor_name"
                   placeholder="Doctor Name"
                   required>

            <br><br>

            <input type="text"
                   name="specialization"
                   placeholder="Specialization"
                   required>

            <br><br>

            <input type="text"
                   name="phone"
                   placeholder="Phone Number"
                   required>

            <br><br>

            <select name="availability">
                <option value="Available">Available</option>
                <option value="Unavailable">Unavailable</option>
            </select>

            <br><br>

            <button type="submit">Add Doctor</button>

        </form>

    </div>

    <h2>Doctor List</h2>

    {% for doctor in doctors %}

    <div class="card">

        <h3>{{ doctor.doctor_name }}</h3>

        <p>Specialization: {{ doctor.specialization }}</p>

        <p>Phone: {{ doctor.phone }}</p>

        <p>Availability: {{ doctor.availability }}</p>
        <a href="/edit-doctor/{{ doctor.doctor_id }}">
    <button type="button">Edit Doctor</button>
</a>

        <form action="/delete-doctor/{{ doctor.doctor_id }}"
              method="POST"
              onsubmit="return confirm('Are you sure you want to delete this doctor?');">

            <button type="submit">Delete Doctor</button>

        </form>

    </div>

    {% endfor %}

    <br>

    <a href="/admin-panel">Back to Admin Panel</a>

</body>
</html>
