<!DOCTYPE html>
<html>
<head>
    <title>Our Doctors</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Our Hospital Doctors</h1>

    <div class="dashboard">

        {% for doctor in doctors %}

        <div class="card">

            <h2>{{ doctor.doctor_name }}</h2>

            <p>
                <b>Specialization:</b>
                {{ doctor.specialization }}
            </p>

            <p>
                <b>Phone:</b>
                {{ doctor.phone }}
            </p>

            <p>
                <b>Availability:</b>
                {{ doctor.availability }}
            </p>

        </div>

        {% endfor %}

    </div>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
